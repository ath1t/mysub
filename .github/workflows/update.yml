name: update-subscriptions

on:
  schedule:
    - cron: "0 * * * *" # Every 1 hour (နာရီတိုင်းတွင် တစ်ကြိမ် Run မည်)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoIP reader and database
        run: |
          pip install maxminddb
          curl -sL -o geo.mmdb https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb

      - name: Run Update Script
        run: python update.py # (သင့် Python script ဖိုင်နာမည်အတိုင်း ထည့်ပါ)

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A sub nodes.txt country COUNTRIES.md
          git diff --cached --quiet || git commit -m "Auto-update subscriptions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
