name: update-subscriptions
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GeoIP reader and database
        run: |
          pip install maxminddb
          curl -sL -o geo.mmdb https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb
      - run: python update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A sub nodes.txt country COUNTRIES.md
          git diff --cached --quiet || git commit -m "Update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
